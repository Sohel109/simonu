<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>SimONU Marseille - Association de Simulation des Nations Unies | KEDGE Business School</title>
    <meta name="description" content="SimONU Marseille est l'association de simulation de l'ONU de KEDGE Business School. Formation aux enjeux de la diplomatie internationale, négociation et débat structuré depuis 2006." />
    <meta name="keywords" content="SimONU, ONU, diplomatie, KEDGE, Marseille, simulation, relations internationales, NMUN" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SimONU Marseille - Association de Simulation des Nations Unies" />
    <meta property="og:description" content="Former les citoyens de demain à la diplomatie et au débat international" />
    <meta property="og:url" content="https://simonu-marseille.fr" />
    
    <!-- Preconnect for Faster Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Hard-block Google Translate toolbar (CSS + MutationObserver) -->
    <style>
      /* Bloquer l'affichage de toutes les barres et popups connues de Google Translate */
      .goog-te-banner-frame, .goog-te-balloon-frame, #goog-gt-tt, .skiptranslate > iframe, .VIpgJd-Zvi9od-aZ2wEe-wOHMyf, #google_translate_element { 
        display: none !important; 
        visibility: hidden !important;
      }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
      
      /* Empêcher Google Translate de décaler la page vers le bas */
      html, body { 
        top: 0px !important; 
        margin-top: 0px !important; 
        position: static !important; 
      }
    </style>
    <script>
      // Masquage agressif continu pour contrer les réinjections au changement de page sans casser le moteur de traduction
      (function() {
        function hideGTBar() {
          var frames = document.querySelectorAll('.goog-te-banner-frame, .skiptranslate > iframe');
          frames.forEach(function(f) { 
            f.style.setProperty('display', 'none', 'important');
            f.style.setProperty('visibility', 'hidden', 'important');
          });
          if (document.body) {
            document.body.style.setProperty('top', '0px', 'important');
            document.body.style.setProperty('margin-top', '0px', 'important');
          }
          if (document.documentElement) {
            document.documentElement.style.setProperty('top', '0px', 'important');
            document.documentElement.style.setProperty('margin-top', '0px', 'important');
          }
        }
        var observer = new MutationObserver(hideGTBar);
        document.addEventListener('DOMContentLoaded', function() {
          hideGTBar();
          observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'fr', includedLanguages: 'en,fr', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
